# Oracle Consumer Template
# Starter for a dApp that consumes oracle data on Atipicial.

[template]
name = "oracle-consumer"
description = "Oracle consumer starter (fetch/read oracle-fed state)"
version = "1.0.6"
author = "AtipicialRust Team"

[files]
"src/main.rs" = '''
//! Oracle consumer starter
//!
//! This template demonstrates:
//! - Connecting to Atipicial TestNet
//! - A starting point for reading oracle-fed state from a contract

use atipicial::sdk::Atipicial;
use std::error::Error;

#[tokio::main]
async fn main() -> Result<(), Box<dyn Error>> {
    println!("🔮 Oracle Consumer Starter");

    let atipicial = Atipicial::testnet().await?;
    let height = atipicial.get_block_height().await?;
    println!("✅ Connected (height = {})", height);

    // NOTE: Add your contract hash and view method to read oracle-fed data.
    // Example: atipicial.invoke_read(contract_hash, "getPrice", vec![]).await?;
    println!("ℹ️  Next: call `atipicial.invoke_read(...)` for your contract’s getter method.");

    Ok(())
}
'''

"Cargo.toml" = '''
[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
atipicial = "{{atipicial_version}}"
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
'''

"README.md" = '''
# {{project_name}} - Oracle Consumer Starter

Oracle consumer starter built with AtipicialRust SDK v{{atipicial_version}}.

## Next Steps

- Deploy or connect to a contract that stores oracle-fed data
- Add read-only RPC calls to verify oracle updates
- Add transactions to request oracle updates (if applicable)
'''
