[package]
name = "atipicial_nns_examples"
version = "0.1.0"
edition = "2021"
authors = ["R3E Network <jimmy@r3e.network>"]
publish = false


[features]
default = []
futures = ["atipicial/futures"]
ledger = ["atipicial/ledger"]
[dependencies]
atipicial = { path = "../../", package = "atipicial", features = [] }
