[package]
name = "standalone-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "Topical end-to-end examples that previously lived as loose .rs files in examples/. Wired into the workspace so they are compile-checked against the live API."

[dependencies]
atipicial = { path = "../..", features = ["futures"] }

# These are already transitive deps of atipicial; we list them so the example bins
# can reference them directly without atipicial having to re-export every crate.
tokio = { version = "1", features = ["full"] }
num-bigint = "0.4"
bip39 = { version = "2.2.2", features = ["rand"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[features]
# Forward to atipicial so the example's `#[cfg(feature = "ws")]` blocks compile.
default = ["ws"]
ws = ["atipicial/ws"]

[[bin]]
name = "example_high_level_sdk"
path = "src/bin/high_level_sdk.rs"

[[bin]]
name = "example_gas_estimation"
path = "src/bin/gas_estimation.rs"

[[bin]]
name = "example_production_ready_client"
path = "src/bin/production_ready_client.rs"

[[bin]]
name = "example_v1_0_features"
path = "src/bin/v1_0_features.rs"
