# DeFi Protocol Template
# Starter for building a DeFi-focused Atipicial dApp.

[template]
name = "defi-protocol"
description = "DeFi-focused dApp starter (swap/pools/positions)"
version = "1.0.6"
author = "AtipicialRust Team"

[files]
"src/main.rs" = '''
//! DeFi dApp starter
//!
//! This template demonstrates:
//! - Connecting to Atipicial TestNet
//! - A starting point for integrating with DeFi contracts/protocols

use atipicial::sdk::Atipicial;
use std::error::Error;

#[tokio::main]
async fn main() -> Result<(), Box<dyn Error>> {
    println!("🧩 DeFi Protocol Starter");

    let atipicial = Atipicial::testnet().await?;
    let height = atipicial.get_block_height().await?;
    println!("✅ Connected (height = {})", height);

    // NOTE: Replace with calls into your DeFi contracts / routers.
    // Example: atipicial.invoke_write(contract_hash, "swap", params).await?;
    println!("ℹ️  Next: add contract hashes + invoke_read/invoke_write flows.");

    Ok(())
}
'''

"Cargo.toml" = '''
[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
atipicial = "{{atipicial_version}}"
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
'''

"README.md" = '''
# {{project_name}} - DeFi Starter

DeFi starter built with AtipicialRust SDK v{{atipicial_version}}.

## Ideas to Implement

- Query pools and token metadata
- Fetch user balances/positions
- Build + sign swap/add-liquidity/remove-liquidity transactions
'''
